name: CI

on:
  # Deliberately NOT `push: branches: [main]`. A merge re-ran this entire matrix
  # against a tree the pull_request check had already gated — ~11 minutes of
  # duplicate signal per merge, of which `backend` alone was ~10.
  #
  # The duplicate run did produce one thing of value, and it is not obvious:
  # `Swatinem/rust-cache` writes a 1.19 GB dependency cache, and GitHub scopes
  # cache entries BY REF. An entry written on `refs/pull/N/merge` is visible to
  # that PR and to nothing else; only entries on the DEFAULT branch are
  # inherited by every branch. The push-on-main run was the sole writer of the
  # shared entry, so simply deleting this trigger would have left each new PR
  # compiling 492 dependencies from cold — slower PRs, not faster ones.
  # `release.yml` does not cover the gap: it caches through sccache, a different
  # key space entirely.
  #
  # `cache-warm.yml` now performs that one job on main and asserts nothing else.
  # If you restore `push:` here, delete cache-warm.yml in the same change —
  # otherwise both write the same cache key and race.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo.
permissions:
  contents: read

jobs:
  backend:
    name: backend — fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # `ci.yml` installed lld and never told rustc to use it, so the backend
      # job linked dozens of test binaries with GNU ld anyway. This mirrors the
      # pattern packaging/rpm/build-rpm.sh already uses for the release build,
      # where lld is proven against this workspace's DuckDB link.
      #
      # Deliberately job env, not backend/.cargo/config.toml: a config file
      # would also apply to developer machines that may not have lld, and to
      # rpmbuild, where sauron.spec exports its own RUSTFLAGS that would
      # override it regardless.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      # [profile.test] is empty, so it inherited [profile.dev] debug = 1.
      # `cargo test` spends ~7 minutes compiling and ~2 seconds running (every
      # test result line reads 0.00s), so codegen and link cost is the whole
      # bill. Set here rather than in Cargo.toml so local `cargo test` keeps
      # its debuginfo for actual debugging.
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: backend
    # Backs the `sauron-db`/`sauron-api` integration harnesses (see
    # `crates/sauron-db/tests/common/mod.rs`): without a reachable database,
    # `TestDb::setup()` returns `None` and every env-scoping test silently
    # reports "passed" in 0.00s instead of actually running. Versions matched
    # to what `docker-compose.yml` pins (`postgres:16`, `redis:7`), not just
    # "latest", so CI exercises the same server version the project targets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sauron
          POSTGRES_PASSWORD: sauron
          POSTGRES_DB: sauron
          # PGDATA is a SUBDIRECTORY of the tmpfs mount, not the mount itself.
          # Docker creates the mountpoint root-owned, and initdb refuses a data
          # directory it does not own; the entrypoint creates and chowns a
          # subdirectory itself, which sidesteps that entirely.
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432:5432
        # Postgres on a RAM disk. The measured bottleneck of the backend job is
        # not scheduling — the nextest trial (#55) proved that by improving
        # scheduling and getting 6s SLOWER. It is ~398 CREATE DATABASE /
        # DROP DATABASE pairs, each copying the migrated template, on a disk
        # shared with the 4 vCPUs running the tests. 249s of the 380s test step.
        #
        # Nothing here needs to survive the job: every database is created and
        # dropped inside it, and the container is discarded at the end. Durability
        # is being paid for and thrown away.
        #
        # 1g is generous — the template plus the handful of ephemeral copies
        # alive at once are megabytes — but the runner has 16 GB and running out
        # would present as confusing postgres errors rather than a clean failure.
        options: >-
          --tmpfs=/var/lib/postgresql/data:rw,size=1g
          --health-cmd="pg_isready -U sauron"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain deps (pkg-config + libzstd for the system-zstd link)
        run: sudo apt-get update -q && sudo apt-get install -y -q pkg-config libzstd-dev lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          # Pins the cache key rather than letting rust-cache derive one from
          # the job. `cache-warm.yml` has to WRITE the key this job READS, and
          # it cannot reach a derived id from another file. Two consequences,
          # both intended: renaming either job is now free, and changing this
          # string in one file without the other is what breaks the sharing —
          # which costs exactly one cold run to notice, not silent slow rot.
          #
          # Adding this changed the key once, so the first run after it merges
          # restores nothing and rebuilds the dependency graph cold.
          shared-key: backend
      - name: Cache libduckdb download
        uses: actions/cache@v4
        with:
          path: .cache/duckdb
          key: libduckdb-${{ hashFiles('backend/Cargo.lock') }}
      - name: Fetch prebuilt libduckdb (DuckDB is linked unbundled)
        # DUCKDB_LIB_DIR lets sauron-tier link the prebuilt lib; LD_LIBRARY_PATH
        # lets the test binaries load it at runtime.
        run: |
          DIR=$(../packaging/rpm/fetch-libduckdb.sh)
          echo "DUCKDB_LIB_DIR=$DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$DIR" >> "$GITHUB_ENV"
      # fmt and clippy are both hard gates: the tree is fmt-clean and
      # clippy-clean as of b78f2ae, so any new finding is a real regression.
      # clippy needs -D warnings — without it the command exits 0 on warnings
      # and the gate would silently pass.
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        # No --all-features: it would enable sauron-tier's `bundled` feature and
        # recompile DuckDB from source (needs the C++ toolchain we no longer install).
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        # TEST_DATABASE_URL/TEST_REDIS_URL opt the harness in — without them
        # `TestDb::setup()` returns `None` and every env-scoping test reports
        # "passed" in 0.00s without running (see the module doc on
        # `crates/sauron-db/tests/common/mod.rs`). A developer without a local
        # database still gets a green `cargo test --workspace` by simply not
        # setting these — the skip path is intentionally preserved, only CI's
        # reliance on it is being fixed here.
        env:
          TEST_DATABASE_URL: postgres://sauron:sauron@localhost:5432/sauron
          TEST_REDIS_URL: redis://localhost:6379
        # This is the BACKEND-side half of the wire gate: it parses the
        # COMMITTED `sdks/wire-fixtures/*.json` on a clean checkout (see
        # `crates/sauron-core/tests/sdk_wire_conformance.rs`), so it catches the
        # deserializer changing under a fixed SDK output. It cannot catch the
        # other direction — an SDK whose output drifts leaves this job parsing
        # the stale committed file and passing. That half is the
        # `check-wire-fixture.sh` step in each of the five sdk-* jobs below;
        # neither half is sufficient alone.
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # RUSTSEC advisories.
  #
  # A separate job, NOT a step on `backend`: that job is the critical path
  # (~10 min of compile), and an advisory check that has to wait behind a full
  # build is one people start skipping. This needs only `Cargo.lock`, so it
  # finishes in seconds on a cold runner.
  #
  # Not added to `security.yml` either, deliberately — that file is deployed
  # from a canonical template (`reusable_assets/ci-security`) and its own header
  # says an edit here gets overwritten by the deploy script. A rule that a
  # deploy silently reverts is worse than no rule, because it looks present.
  # Trivy there does scan dependencies, but nothing in the fleet template is
  # Rust-specific, and RUSTSEC advisories have had to be cleared by hand before
  # (#41).
  #
  # `continue-on-error` on the audit step: a newly published advisory with no
  # fixed version available would otherwise block every unrelated PR overnight.
  # The job still reports, and `--deny warnings` keeps unmaintained crates
  # visible rather than silently tolerated.
  cargo-audit:
    name: backend — RUSTSEC advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-v1
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked
      - name: cargo audit
        continue-on-error: true
        working-directory: backend
        run: cargo audit --deny warnings

  dashboard:
    name: dashboard — build · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build          # svelte-check + vite build
      - run: npm test               # vitest

  # ---------------------------------------------------------------------------
  # SDK jobs.
  #
  # Every one of the five runs its suite, and every suite REGENERATES
  # `sdks/wire-fixtures/<sdk>.json` from the envelope its own transport posts.
  # Each job therefore ends with `.github/scripts/check-wire-fixture.sh`, which
  # fails if that regeneration differs from the committed file.
  #
  # Without that step the regeneration was thrown away and CI only caught wire
  # drift on the backend side: an SDK-side regression left its own job green
  # (it regenerates) and `backend` green (it parses the stale committed file), so
  # the bug shipped with a passing conformance test on top of it. node, python
  # and csharp had no CI job at all, so their fixtures were never regenerated
  # anywhere.
  #
  # The gate step must run AFTER the suite and is deliberately not
  # `continue-on-error` — see the script for what a diff means.
  # ---------------------------------------------------------------------------

  sdk-js:
    # ⚠ THIS NAME IS PINNED TO BRANCH PROTECTION — DO NOT EDIT IT.
    #
    # `main`'s required status checks name this job by its EXACT display string.
    # It used to read "web SDK — test · build · wire fixture",
    # and the trailing " · wire fixture" meant nothing ever reported the required
    # name: the check sat at "Expected — Waiting for status to be reported"
    # forever and no PR could merge. Ten green checks, two ghosts, permanently
    # blocked.
    #
    # The job still runs the wire-fixture step; only the label is shorter.
    #
    # This pin is TEMPORARY. Once branch protection requires `CI complete`
    # instead (see the ci-complete job at the bottom of this file), delete this
    # comment and name the job whatever is clearest.
    name: web SDK — test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - run: npm ci
      - run: npm test
      - name: wire fixture in sync (SDK-side drift gate)
        working-directory: .
        run: bash .github/scripts/check-wire-fixture.sh js
      - run: npm run build
      - name: typecheck (report-only)
        continue-on-error: true
        run: npm run typecheck

  sdk-node:
    name: node SDK — test · build · wire fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm test
      - name: wire fixture in sync (SDK-side drift gate)
        working-directory: .
        run: bash .github/scripts/check-wire-fixture.sh node
      - run: npm run build
      - name: typecheck (report-only)
        continue-on-error: true
        run: npm run typecheck

  sdk-python:
    name: python SDK — test · wire fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned rather than "3.x": the fixture normalizer pins
          # `context.runtime.version`, but a floating interpreter is still one
          # more thing that can move under a byte-comparison gate for no reason.
          python-version: '3.12'
      # The package has no runtime dependencies (stdlib urllib + threading); the
      # `test` extra is just pytest. Installed as editable so `import sauron`
      # resolves to the source under test, not a built copy.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: wire fixture in sync (SDK-side drift gate)
        working-directory: .
        run: bash .github/scripts/check-wire-fixture.sh python

  sdk-csharp:
    name: dotnet SDK — test · wire fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Three DIFFERENT constraints are in play here and the previous version
          # of this comment reasoned about only one of them, which is why this job
          # could not run at all:
          #
          #  1. WHAT IS COMPILED — `net8.0`, pinned by both .csproj files.
          #  2. WHAT IT RUNS ON — `RollForward: Major` in Sauron.Tests.csproj lets
          #     the net8.0 test host run on a newer runtime; installing 8.0.x
          #     means it does not have to.
          #  3. WHAT READS THE SOLUTION — nothing above says anything about this,
          #     and it is the one that mattered. `sdks/csharp` contains only
          #     `Sauron.slnx` (the XML solution format): no `.sln`, no root
          #     `.csproj`. `.slnx` is unreadable before SDK **9.0.200**, so with
          #     only 8.0.x installed a bare `dotnet test` here died with
          #     `MSB1003: Specify a project or solution file` — measured against
          #     9.0.119, which reproduces it — BEFORE reaching the wire-fixture
          #     gate below. One of the five wire gates therefore never executed.
          #
          # `sdks/csharp/global.json` is what makes (3) binding rather than
          # advisory: absent it the muxer simply takes the highest SDK the runner
          # image happens to ship, so a future image preinstalling 9.0.2xx+ would
          # have made this job pass BY ACCIDENT — indistinguishable from not
          # pinning. With global.json a too-old SDK fails naming the version it
          # wanted and the file that asked for it, instead of MSB1003.
          dotnet-version: |
            8.0.x
            9.0.x
      # Resolves `Sauron.slnx` → both projects, per sdks/csharp/global.json.
      - run: dotnet test
      - name: wire fixture in sync (SDK-side drift gate)
        working-directory: .
        run: bash .github/scripts/check-wire-fixture.sh csharp

  sdk-flutter:
    # ⚠ THIS NAME IS PINNED TO BRANCH PROTECTION — DO NOT EDIT IT.
    #
    # `main`'s required status checks name this job by its EXACT display string.
    # It used to read "flutter SDK — analyze · test · wire fixture",
    # and the trailing " · wire fixture" meant nothing ever reported the required
    # name: the check sat at "Expected — Waiting for status to be reported"
    # forever and no PR could merge. Ten green checks, two ghosts, permanently
    # blocked.
    #
    # The job still runs the wire-fixture step; only the label is shorter.
    #
    # This pin is TEMPORARY. Once branch protection requires `CI complete`
    # instead (see the ci-complete job at the bottom of this file), delete this
    # comment and name the job whatever is clearest.
    name: flutter SDK — analyze · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze (report-only)
        continue-on-error: true
        run: flutter analyze
      - run: flutter test
      # NOTE: `channel: stable` is unpinned, so this is the one gate that a
      # Flutter release — not a repo change — could trip, if a new `package:test`
      # changes the stack depth `captureException` records (the frame COUNT is
      # kept on purpose; only frame identity strings are normalized). If that
      # happens the failure is loud and the fix is one regenerate-and-commit, not
      # a mystery. Pinning `flutter-version` here would remove that at the cost
      # of no longer testing against current stable.
      - name: wire fixture in sync (SDK-side drift gate)
        working-directory: .
        run: bash .github/scripts/check-wire-fixture.sh flutter

  # ---------------------------------------------------------------------------
  # Migration integrity gate.
  #
  # Migration 000046 (`channel_config_enc`) existed on disk, applied cleanly
  # locally, and was invisible to the release build because it was never
  # tracked by git — `git archive` builds the RPM tarball from the INDEX/HEAD,
  # not from the working tree, so an untracked directory ships as nothing at
  # all and the new binaries meet an old schema. Nothing in CI looked at
  # `backend/migrations` (`grep -n migrations .github/workflows/*.yml` returned
  # nothing), so the whole class was unguarded.
  #
  # Four assertions, all of them shell-only — no toolchain, no database, so
  # this job is the fastest signal in the matrix and fails before anything
  # expensive starts.
  # ---------------------------------------------------------------------------
  migrations:
    name: migrations — tracked · paired · ordered · immutable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Check 4 reads the migration trees of every release tag. The default
          # shallow, tag-less checkout would make it silently skip.
          fetch-depth: 0
      - name: Migration integrity guard
        shell: bash
        run: |
          # GitHub runs `run:` under `bash -e`; errexit is wrong here because
          # the guard deliberately keeps going so one CI run reports EVERY
          # offending path instead of only the first.
          set +e
          set -uo pipefail

          MIG=backend/migrations
          fail=0
          note() { printf '%s\n' "$*" >&2; }
          die()  { note "::error::$*"; fail=1; }

          # ---- 1. every migration on disk is TRACKED in git -----------------
          # The release tarball is produced from git, not from the working
          # tree: anything git does not know about does not ship.
          disk_up=$(find "$MIG" -mindepth 2 -maxdepth 2 -name up.sql | wc -l)
          tracked_up=$(git ls-files "$MIG" | grep -c '/up\.sql$')
          note "check 1: up.sql on disk=$disk_up, tracked by git=$tracked_up"
          if [ "$disk_up" -ne "$tracked_up" ]; then
            die "migration count mismatch: $disk_up up.sql on disk but only $tracked_up tracked by git. The release tarball is built from git, so the untracked ones will NOT ship and upgraded hosts will run new binaries against an old schema."
            comm -23 <(find "$MIG" -mindepth 2 -maxdepth 2 -name '*.sql' | sort) \
                     <(git ls-files "$MIG" | sort) \
              | while read -r p; do note "::error file=$p::not tracked by git: $p"; done
          fi

          untracked=$(git status --porcelain --untracked-files=all -- "$MIG" | awk '$1=="??"{print $2}')
          if [ -n "$untracked" ]; then
            while read -r p; do
              die "untracked migration file, invisible to 'git archive' and therefore to the RPM: $p — run 'git add $p'"
            done <<<"$untracked"
          fi

          # The root cause of an untracked migration is usually a .gitignore
          # rule quietly swallowing it: `git add` then succeeds with no output.
          # --no-index is required, otherwise check-ignore skips already-tracked
          # paths and the rule stays invisible until someone re-clones.
          while IFS= read -r p; do
            if git check-ignore --no-index -q "$p"; then
              die "migration path matches a .gitignore rule, so 'git add' silently drops it: $p [$(git check-ignore --no-index -v "$p")]"
            fi
          done < <(find "$MIG" -mindepth 2 -maxdepth 2 -name '*.sql')

          # ---- 2. every migration has BOTH up.sql and down.sql --------------
          while IFS= read -r d; do
            [ -f "$d/up.sql" ]   || die "migration $d is missing up.sql — diesel will not apply it."
            [ -f "$d/down.sql" ] || die "migration $d is missing down.sql — 'diesel migration revert' and the packaging rollback path both break on it."
          done < <(find "$MIG" -mindepth 1 -maxdepth 1 -type d | sort)

          # ---- 3. lexicographic name order == sequence-number order ---------
          # Diesel applies directories in lexicographic DIRECTORY-NAME order,
          # not by the embedded sequence number. A future-dated prefix
          # (2026-08-10-000046 landing before a later-authored 2026-08-09-000047)
          # therefore runs out of order — that is exactly why 000046 had to be
          # re-dated by hand.
          prev=0; prevdir=""
          while IFS= read -r b; do
            seq=$(printf '%s\n' "$b" | sed -n 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-\([0-9]\{6\}\)_.*$/\1/p')
            if [ -z "$seq" ]; then
              die "migration directory name does not match YYYY-MM-DD-NNNNNN_slug: $MIG/$b"
              continue
            fi
            n=$((10#$seq))
            if [ "$n" -le "$prev" ]; then
              die "migration ordering broken: '$b' (sequence $n) sorts lexicographically AFTER '$prevdir' (sequence $prev) but its sequence number is not greater. Diesel applies migrations in directory-name order, so '$b' would run out of sequence. Re-date one of the two so the date prefixes increase in step with the sequence numbers."
            fi
            prev=$n; prevdir=$b
          done < <(cd "$MIG" && find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)

          # ---- 4. a released migration is never edited afterwards -----------
          # Cheaply expressible because every release is tagged and the tag's
          # tree carries the migration blobs: compare each released blob hash
          # against the same path today. Hosts that upgraded from that tag have
          # already recorded the migration as applied and will never re-run it,
          # so an edit reaches new installs only — a permanent schema fork.
          tags=$(git for-each-ref --format='%(refname:short)' refs/tags)
          if [ -z "$tags" ]; then
            note "::notice::no release tags in this checkout — skipping the released-migration immutability check"
          else
            note "check 4: comparing against release tags: $(echo $tags | tr '\n' ' ')"
            for t in $tags; do
              while IFS=$'\t' read -r oldhash path; do
                [ -n "$path" ] || continue
                if [ ! -f "$path" ]; then
                  die "$path shipped in release tag '$t' but has been DELETED. Released migrations are immutable — add a NEW migration that undoes it instead."
                  continue
                fi
                newhash=$(git hash-object -- "$path")
                if [ "$oldhash" != "$newhash" ]; then
                  die "$path was EDITED after it shipped in release tag '$t' ($oldhash -> $newhash). Hosts upgraded from '$t' already applied the OLD text and will never re-run it, so this edit only reaches fresh installs. Add a NEW migration instead."
                fi
              done < <(git ls-tree -r "$t" -- "$MIG" | awk '$2=="blob"{print $3"\t"$4}')
            done
          fi

          # ---- 5. every path the PACKAGING references actually EXISTS -------
          #
          # Checks 1-3 cannot catch this class, and neither can any `git status`
          # check, because CI only ever sees TRACKED files: an untracked file is
          # simply absent from the checkout, so "is it untracked?" is unanswerable
          # here. The question that IS answerable is "does everything the build
          # reads exist?".
          #
          # This is not hypothetical. `packaging/rpm/systemd/50-sauron.preset`
          # was added to the spec's %install without being staged. Locally it
          # built fine, because build-rpm.sh tars the WORKING TREE. From a
          # release checkout rpmbuild died with
          #   install: cannot stat 'packaging/rpm/systemd/50-sauron.preset'
          # in %install, taking every RPM with it. Same shape as the untracked
          # migration above, one directory over.
          # The .deb path has exactly the same exposure and reads the SAME
          # packaging/rpm/ assets (units, sysusers, tmpfiles, config, nginx,
          # scripts) — deliberately, so the two formats cannot drift — which means
          # one untracked file there now kills both releases at once.
          missing=0
          for src in packaging/rpm/sauron.spec \
                     packaging/deb/debian/rules \
                     packaging/deb/build-deb.sh; do
            if [ ! -f "$src" ]; then
              die "$src is missing"
              continue
            fi
            note "check 5: resolving repo paths referenced by $src"
            # Every bare packaging/... token: Source lines, install arguments,
            # anything. Deliberately greedy — a false positive here is a one-line
            # fix, a false negative is a dead release.
            # sed, not `tr -d '[:space:]'`: tr would also delete the NEWLINES
            # between matches and collapse every path into one unopenable token.
            # The first version of this guard did exactly that and "passed".
            # Two normalisations, both needed once prose comments (not just
            # install arguments) mention packaging paths:
            #   * strip trailing sentence punctuation — "see packaging/deb/rules."
            #     otherwise reports a missing file called 'rules.'
            #   * skip tokens containing '..' — an elided path in prose such as
            #     "reads packaging/rpm/..." is not a path claim at all
            # Still greedy about everything else: a false positive is a one-line
            # fix, a false negative is a dead release.
            for ref in $(grep -oE '(^|[[:space:]])packaging/[A-Za-z0-9._/-]+' "$src" \
                          | sed -e 's/^[[:space:]]*//' -e 's/[.,;:)]*$//' \
                          | grep -v '\.\.' | sort -u); do
              if [ ! -e "$ref" ]; then
                die "$src references '$ref' but it does not exist in this checkout. If it exists on your machine it is UNTRACKED — run 'git add $ref'. The build will fail while installing files, taking every package with it."
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] && note "  all referenced packaging paths present"

          # ---- 6. the RPM and the .deb ship the same binaries ---------------
          # Each format's build catches only its OWN drift, so a binary can reach
          # one and not the other with both builds green. Shell-only, so it
          # belongs in this job rather than behind a container.
          if [ -x packaging/tests/manifest-parity.sh ]; then
            note "check 6: rpm/deb binary manifest parity"
            packaging/tests/manifest-parity.sh || fail=1
          else
            die "packaging/tests/manifest-parity.sh is missing or not executable"
          fi

          if [ "$fail" -ne 0 ]; then
            note "MIGRATION GUARD FAILED — see the ::error:: lines above."
            exit 1
          fi
          note "MIGRATION GUARD OK ($disk_up migrations)"

  packaging:
    name: packaging — spec lint · source RPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44
    # GitHub's default `run:` shell inside a `container:` is sh, NOT bash, and
    # on Debian-family images sh is dash. Fedora hides it (/bin/sh is bash), so
    # a bash-ism written here would pass on this job and fail on packaging-deb
    # below with `set: Illegal option -o pipefail` -- which is how the first
    # .deb release run died. Declare the shell rather than inherit the image's.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install rpm tooling
        run: dnf install -y --allowerasing rpm-build rpmlint systemd-rpm-macros git tar gzip gawk curl unzip findutils
      - uses: actions/checkout@v4
      - name: Trust the workspace (container git)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Spec parses
        run: rpmspec -P packaging/rpm/sauron.spec >/dev/null && echo "spec OK"
      - name: rpmlint (report-only)
        continue-on-error: true
        run: rpmlint packaging/rpm/sauron.spec
      - name: Cache libduckdb download
        uses: actions/cache@v4
        with:
          path: .cache/duckdb
          key: libduckdb-${{ hashFiles('backend/Cargo.lock') }}
      - name: Source RPM builds (validates SourceN staging + tarball)
        run: ./packaging/rpm/build-rpm.sh --srpm

  # ---------------------------------------------------------------------------
  # The .deb counterpart. Goes further than the RPM job above because it can:
  # dpkg install/upgrade/purge needs no database and no real binaries, so the
  # whole lifecycle is exercised here rather than only the build.
  #
  # Built from STUB binaries (packaging/deb/tests/make-stub-prebuilt.sh), which is
  # what makes that affordable — compiling the workspace to find out whether a
  # postinst chgrps the right file would cost ~40 minutes per PR. The stubs are
  # real ELF and sauron-tier really links a libduckdb.so with the real SONAME, so
  # everything the packaging depends on is still under test; only Sauron's own
  # behaviour is not, and no gate here is about that.
  #
  # Both distros, because they are two different debhelper versions (13.11.4 vs
  # 13.6) with different sequences — dh_installsysusers is in neither at compat
  # 13, but bookworm has an add-on for it that jammy lacks, so "works on Debian"
  # genuinely does not imply "works on Ubuntu" here.
  # ---------------------------------------------------------------------------
  packaging-deb:
    name: packaging deb — build · install · upgrade · purge (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04"]
    container: ${{ matrix.image }}
    # Both images are Debian-family, where the container default shell (sh) is
    # dash. See the `packaging` job above.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packaging + test tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            debhelper dpkg-dev gcc libc6-dev git ca-certificates
      - uses: actions/checkout@v4
      - name: Trust the workspace (container git)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build, install, upgrade and purge the packages
        env:
          DEBIAN_FRONTEND: noninteractive
          DEB_BUILD_TOPDIR: ${{ github.workspace }}/debbuild
        run: ./packaging/deb/tests/install-test.sh

  # ---------------------------------------------------------------------------
  # The single job branch protection should require.
  #
  # Required status checks are matched by EXACT DISPLAY NAME, and that coupling
  # rots silently. This repo shipped with two required checks named
  #   "flutter SDK — analyze · test"   and   "web SDK — test · build"
  # while the jobs had since been renamed to
  #   "flutter SDK — analyze · test · wire fixture"  /  "web SDK — test · build · wire fixture"
  # Nothing ever reported those names, so both sat at "Expected — Waiting for
  # status to be reported" forever and the PR could not be merged. Meanwhile the
  # other seven jobs — including `backend` and `migrations` — were not required
  # at all, so once the names were corrected a fully red backend would still have
  # been mergeable.
  #
  # Requiring ONE aggregating job removes the coupling: jobs can be added,
  # renamed or reordered and the gate keeps meaning "everything passed". The only
  # thing that must stay in sync is the `needs:` list below, which lives next to
  # the jobs it names instead of in a settings page nobody reads.
  #
  # Set branch protection to require exactly: CI complete
  #
  # UNTIL THAT SETTING CHANGES, two job names above are NOT free to rename:
  # `sdk-js` and `sdk-flutter` are pinned to the stale required-check strings so
  # the current protection can be satisfied at all. Each carries a warning at its
  # `name:`. Switching protection to `CI complete` is what unpins them — do that
  # first, then rename them back to include "· wire fixture" if you want.
  ci-complete:
    name: CI complete
    # `always()` so this still runs when a dependency fails — without it the job
    # would be skipped and report nothing, which is the same dead end as the
    # misnamed checks above.
    if: always()
    needs:
      - backend
      - cargo-audit
      - dashboard
      - sdk-js
      - sdk-node
      - sdk-python
      - sdk-csharp
      - sdk-flutter
      - migrations
      - packaging
      - packaging-deb
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The `needs:` list above is the new single point of rot: add a job and
      # forget to list it, and the gate silently stops covering it — the same
      # shape as the misnamed required checks this job replaced. So the gate
      # checks its own coverage. Dependency-free on purpose (no PyYAML): the
      # parse only has to understand this one file's shape.
      - uses: actions/checkout@v4
      - name: Gate covers every job
        run: |
          python3 - <<'EOF'
          import re, sys
          src = open('.github/workflows/ci.yml').read()
          body = src.split('\njobs:\n', 1)[1]
          jobs = re.findall(r'^  ([A-Za-z0-9_-]+):[ \t]*$', body, re.M)
          block = re.search(r'^  ci-complete:.*?(?=^  [A-Za-z0-9_-]+:[ \t]*$|\Z)',
                            body, re.M | re.S).group(0)
          needs = re.findall(r'^      - ([A-Za-z0-9_-]+)[ \t]*$', block, re.M)
          expected = [j for j in jobs if j != 'ci-complete']
          missing = [j for j in expected if j not in needs]
          unknown = [n for n in needs if n not in jobs]
          print('jobs   :', ' '.join(expected))
          print('covered:', ' '.join(needs))
          if missing:
              print(f"::error::ci-complete does not depend on: {' '.join(missing)}. "
                    "Branch protection requires only 'CI complete', so these jobs are "
                    "currently unguarded — add them to its needs: list.")
          if unknown:
              print(f"::error::ci-complete needs a job that does not exist: {' '.join(unknown)}")
          sys.exit(1 if (missing or unknown) else 0)
          EOF

      # ---- every container job declares its shell ------------------------
      # The default `run:` shell inside a `container:` is sh, NOT bash. On
      # Fedora that is bash wearing a different name, so bash-isms pass; on
      # Debian-family images sh is dash and the first one dies with
      # `set: Illegal option -o pipefail`. release.yml is checked here too
      # because it NEVER runs in CI: the first release with .deb legs failed
      # exactly this way -- both deb legs red, both rpm legs green, identical
      # YAML -- and no PR check could have seen it.
      - name: Container jobs declare their shell
        run: |
          python3 - <<'EOF'
          import re, sys
          fail = False
          for path in ('.github/workflows/ci.yml', '.github/workflows/release.yml'):
              body = open(path).read().split('\njobs:\n', 1)[1]
              starts = [(m.start(), m.group(1))
                        for m in re.finditer(r'^  ([A-Za-z0-9_-]+):[ \t]*$', body, re.M)]
              for i, (pos, job) in enumerate(starts):
                  end = starts[i + 1][0] if i + 1 < len(starts) else len(body)
                  block = body[pos:end]
                  if not re.search(r'^    container:', block, re.M):
                      continue
                  ok = bool(re.search(r'^    defaults:\n      run:\n        shell: bash$',
                                      block, re.M))
                  print(f'{path} :: {job} :: container :: shell '
                        f'{"declared" if ok else "MISSING"}')
                  if not ok:
                      print(f'::error file={path}::job `{job}` runs in a container but does '
                            'not declare `defaults: {run: {shell: bash}}`. A container job '
                            "inherits the image's /bin/sh -- dash on Debian-family images -- "
                            'so set -o pipefail, arrays and process substitution fail there '
                            'while passing on Fedora, where /bin/sh is bash.')
                      fail = True
          sys.exit(1 if fail else 0)
          EOF


      - name: Report every job's result
        env:
          RESULTS: |
            backend     ${{ needs.backend.result }}
            dashboard   ${{ needs.dashboard.result }}
            sdk-js      ${{ needs.sdk-js.result }}
            sdk-node    ${{ needs.sdk-node.result }}
            sdk-python  ${{ needs.sdk-python.result }}
            sdk-csharp  ${{ needs.sdk-csharp.result }}
            sdk-flutter ${{ needs.sdk-flutter.result }}
            migrations  ${{ needs.migrations.result }}
            packaging   ${{ needs.packaging.result }}
            packaging-deb ${{ needs.packaging-deb.result }}
        run: printf '%s\n' "$RESULTS"

      # 'skipped' counts as failure too. No job here has a path filter or a
      # job-level `if:`, so nothing can skip legitimately today — and if someone
      # adds a conditional job later, blocking is the right default: it forces a
      # deliberate decision about whether the gate still means what it says,
      # rather than quietly shrinking coverage.
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::One or more CI jobs did not succeed — see the results printed above."
          exit 1
