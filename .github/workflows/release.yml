name: Release

on:
  # Manual only. Previously every push to main built both distros and published
  # a release — ~24 runner-minutes, over half the CI budget for the repo, on
  # every merge regardless of whether anyone wanted to ship. #53 stopped the
  # merges that could not change a shipped byte; this stops the rest.
  #
  # Matches edraj/csdmart, which triggers its Release on workflow_dispatch and
  # `release: [created]` rather than on merges.
  #
  # The version scheme is unchanged and still works here: major.minor comes
  # from backend/Cargo.toml and the patch is (highest existing v<maj>.<min>.*
  # tag + 1). Releases simply become deliberate rather than automatic, and the
  # patch advances once per release instead of once per merge.
  workflow_dispatch:
    inputs:
      publish:
        # Default false, deliberately. Publishing creates a public release AND
        # a tag, which is not something to do by accident on a run someone
        # started to check that the RPMs still build. Ticking this box is the
        # whole act of releasing, so it should be an explicit act.
        description: 'Publish a real GitHub release (default: dry run, build artifacts only)'
        type: boolean
        default: false

concurrency:
  # Serialize releases so two runs started close together can't compute the
  # same version. Far less likely now that releases are manual, but two people
  # dispatching at once is exactly the case this still covers: the in-flight
  # run finishes first, so the queued one sees its tag and bumps off it.
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Compute the next release version — the single source of truth for every
  # downstream job. major.minor come from backend/Cargo.toml; the patch is the
  # highest existing v<maj>.<min>.* tag + 1 (0 when none exists yet). Humans
  # bump major/minor in Cargo.toml when they want; the patch auto-advances.
  # ---------------------------------------------------------------------------
  version:
    name: compute version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full tag history for the patch scan

      - id: compute
        run: |
          set -euo pipefail
          mm=$(awk -F'"' '/^version *= *"/{split($2,a,"."); print a[1]"."a[2]; exit}' backend/Cargo.toml)
          [ -n "$mm" ] || { echo "::error::could not read major.minor from backend/Cargo.toml"; exit 1; }
          # v0.1.* matches v0.1.5 but not v0.11.0 (fnmatch '.' is literal); sort -V
          # orders patches numerically so v0.1.10 beats v0.1.9.
          latest=$(git tag -l "v${mm}.*" | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            patch=0
          else
            patch=$(( ${latest##*.} + 1 ))
          fi
          version="${mm}.${patch}"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"
          echo "Next release: ${tag} (previous v${mm}.* tag: ${latest:-none})"

  # ---------------------------------------------------------------------------
  # Compile once per distro (native), with a shared sccache so the second distro
  # leg reuses the first's compilation cache. Uploads the binaries + dashboard
  # assets + the prebuilt libduckdb the binaries were linked against.
  #
  # Cargo.toml is left pristine here so the sccache / cargo-registry caches stay
  # warm across releases — the release version is stamped in at package time.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora
            image: fedora:44
          - target: el9
            image: almalinux:9
    container: ${{ matrix.image }}
    env:
      # sccache-backed compilation cache, shared across matrix legs and runs.
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install build toolchain
        # Native code left after the build optimizations is just ring's C/asm, so
        # only a C compiler + perl are needed — no gcc-c++/cmake/clang (DuckDB is
        # prebuilt, TLS is the ring backend, zstd links the system library). zstd
        # needs pkgconfig(libzstd) → libzstd-devel (in CRB on EL9). lld = fast
        # linker; curl+unzip drive the libduckdb fetch.
        run: |
          . /etc/os-release
          # el9's minimal base ships curl-minimal, which conflicts with the full
          # curl package; --allowerasing lets dnf swap it (a no-op on images that
          # already carry full curl).
          dnf install -y --allowerasing \
            gcc perl-interpreter lld pkgconf-pkg-config \
            git tar gzip gawk findutils curl unzip
          case "$ID" in
            fedora)
              dnf install -y libzstd-devel ;;
            *)
              dnf install -y 'dnf-command(config-manager)' || :
              dnf config-manager --set-enabled crb 2>/dev/null \
                || dnf config-manager --set-enabled powertools 2>/dev/null || :
              dnf install -y libzstd-devel ;;
          esac

      - name: Install Rust (rustup — uniform across distros)
        run: |
          # Download then run (not curl|sh): the script hits disk before it runs.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Node 22
        run: |
          . /etc/os-release
          case "$ID" in
            fedora) dnf install -y nodejs npm ;;
            *)      curl -fsSL https://rpm.nodesource.com/setup_22.x -o nodesource_setup.sh
                    bash nodesource_setup.sh
                    dnf install -y nodejs ;;
          esac
          node --version && npm --version

      - uses: actions/checkout@v4

      - name: Trust the workspace (container git)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry (not target — sccache owns compiled objects)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-targets: "false"

      - name: Cache libduckdb download
        uses: actions/cache@v4
        with:
          path: .cache/duckdb
          key: libduckdb-${{ hashFiles('backend/Cargo.lock') }}

      - name: Fetch prebuilt libduckdb
        run: echo "DUCKDB_LIB_DIR=$(packaging/rpm/fetch-libduckdb.sh)" >> "$GITHUB_ENV"

      - name: Compile workspace + dashboard
        run: |
          (cd dashboard && npm ci && npm run build) &
          dashboard_build=$!
          (cd backend && cargo build --release --workspace)
          wait "$dashboard_build"

      - name: sccache stats
        run: sccache --show-stats || true

      - name: Assemble prebuilt artifacts
        run: |
          set -euo pipefail
          mkdir -p prebuilt/bin prebuilt/dist
          # packaging/rpm/binaries.txt is the single source of truth for what ships —
          # build-rpm.sh and the spec's %install read the same file, so a binary added
          # to one can't go missing from another.
          while read -r b; do
            install -m0755 "backend/target/release/$b" "prebuilt/bin/$b"
          done < <(grep -vE '^[[:space:]]*(#|$)' packaging/rpm/binaries.txt)
          cp -a dashboard/dist/. prebuilt/dist/
          install -m0755 "$DUCKDB_LIB_DIR/libduckdb.so" prebuilt/libduckdb.so

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: prebuilt
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Package the precompiled artifacts. No toolchain here — just rpm-build, so it
  # runs in seconds. Native per distro (dist tag + auto-deps computed correctly).
  # The computed version is stamped into the spec + Cargo.toml (checkout only,
  # never committed) so the RPM carries v<maj>.<min>.<patch>-1.
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.target }})
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora
            image: fedora:44
          - target: el9
            image: almalinux:9
    container: ${{ matrix.image }}
    steps:
      - name: Install rpm tooling (no compiler toolchain)
        # el9 minimal base ships coreutils-single, which conflicts with the full
        # coreutils package; --allowerasing swaps it (same commands, no-op elsewhere).
        run: dnf install -y --allowerasing rpm-build systemd-rpm-macros git tar gzip gawk findutils coreutils sed

      - uses: actions/checkout@v4

      - name: Trust the workspace (container git)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: prebuilt

      - name: Stamp computed version into spec + Cargo.toml
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # First `version = "..."` line only — matches build-rpm.sh's reader.
          sed -i '0,/^version = ".*"/s//version = "'"$V"'"/' backend/Cargo.toml
          sed -i -E 's/^(Version:[[:space:]]*).*/\1'"$V"'/'    packaging/rpm/sauron.spec
          sed -i -E 's/^(Release:[[:space:]]*).*/\11%{?dist}/' packaging/rpm/sauron.spec
          echo ">> stamped:"
          grep -E '^version = ' backend/Cargo.toml | head -n1
          grep -E '^(Version|Release):' packaging/rpm/sauron.spec

      - name: Package prebuilt RPMs
        env:
          RPMBUILD_TOPDIR: ${{ github.workspace }}/rpmbuild
        run: ./packaging/rpm/build-rpm.sh --prebuilt "$PWD/prebuilt"

      - uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.target }}
          path: |
            rpmbuild/RPMS/**/*.rpm
            rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  sbom:
    # CycloneDX SBOM of the Rust workspace, read from backend/Cargo.lock. The
    # server ships as a self-contained binary, so its crate graph cannot be
    # recovered from the RPM by a scanner -- it only exists in the lockfile.
    # syft emits spec 1.6; Dependency-Track rejects 1.7.
    name: CycloneDX SBOM
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install syft
        # Pin the installer to a tag (not the moving `main`) and download-then-run.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.18.1/install.sh -o syft-install.sh
          sh syft-install.sh -b "$HOME/.local/bin" v1.18.1
      - name: Generate SBOM
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          "$HOME/.local/bin/syft" dir:backend -o "cyclonedx-json@1.6"="sauron-${VER}.cdx.json" -q
          n=$(grep -c '"purl"' "sauron-${VER}.cdx.json" || true)
          echo "SBOM components: $n"
          [ "${n:-0}" -ge 1 ]

      # syft enumerates the crate graph from Cargo.lock, and a lockfile has no
      # licence field -- so every component it emits arrives with no licence at
      # all. Measured before this step existed: 487 components, 487 unlicensed.
      # In Dependency-Track that is indistinguishable from 487 genuinely
      # unlicensed dependencies, and it buries any real finding.
      #
      # The licence is not missing, only unread: each crate declares it in its
      # own Cargo.toml, which is exactly what `cargo metadata` reports. Reading
      # it there rather than from the crates.io API is deliberate -- it is the
      # manifest the crate was published with, it has no rate limit, and it
      # covers this workspace's own 25 crates, which are unpublished and so
      # cannot be looked up in any registry at all.
      - name: Install Rust (for cargo metadata)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fill licences from cargo metadata
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo metadata --manifest-path backend/Cargo.toml \
            --format-version 1 --locked > cargo-meta.json
          python3 packaging/sbom/fill-cargo-licences.py \
            "sauron-${VER}.cdx.json" cargo-meta.json | tee fill.log

          # Gate the result. Without this the step can silently go back to
          # emitting a licence-free SBOM -- a rustup or cargo change that makes
          # the metadata call fail open would look identical to success in the
          # artifact, which is how this regressed unnoticed in the first place.
          still=$(sed -n 's/^ *still unlicensed *: *//p' fill.log)
          echo "unlicensed after fill: ${still}"
          if [ "${still:-999}" -gt 25 ]; then
            echo "::error::${still} components still have no licence (limit 25)."
            echo "A handful is expected -- crates that ship license-file instead"
            echo "of a license field. Hundreds means the fill did not run."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sauron-*.cdx.json
          if-no-files-found: error

  release:
    name: publish GitHub release
    # A dispatch is a build-only dry run unless `publish` was ticked. There is
    # no automatic path to here any more: nothing publishes without someone
    # asking for it.
    if: inputs.publish
    needs: [version, package, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpms-*     # only the RPMs, not the prebuilt-* binary bundles
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist

      - name: Create release and attach RPMs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find dist \( -name '*.rpm' -o -name '*.cdx.json'  \) | sort)
          [ "${#FILES[@]}" -gt 0 ] || { echo "::error::no RPMs found to release"; exit 1; }
          printf 'asset: %s\n' "${FILES[@]}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Re-run against an existing release/tag: refresh the assets.
            gh release upload "$TAG" --repo "$REPO" --clobber "${FILES[@]}"
          else
            # Creates the v<version> tag at the merge commit, then the release.
            gh release create "$TAG" --repo "$REPO" --target "$SHA" \
              --title "Sauron $TAG" --generate-notes "${FILES[@]}"
          fi
