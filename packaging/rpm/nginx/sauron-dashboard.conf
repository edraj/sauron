# Sauron dashboard — static SPA served by the system nginx.
# NOTE: Fedora's stock /etc/nginx/nginx.conf already defines a `server { listen 80
# default_server; }`. To make THIS the site served on :80, either remove that
# default server block or give this one `listen 80 default_server;` and a real
# server_name. Add TLS as needed for production.
#
# SERVING UNDER A URL PREFIX (e.g. https://host/sauron/):
# this config assumes the host ROOT. A prefix cannot be added here alone — the
# dashboard must also be REBUILT with the prefix baked in:
#
#     DASHBOARD_BASE_PATH=/sauron/ npm run build      # in dashboard/
#
# Vite compiles the prefix into the helper that resolves lazy route chunks, so a
# root-built bundle asks for /assets/* no matter what the proxy says. Do NOT
# reach for `sub_filter` to rewrite index.html: it patches the entry <script> and
# cannot touch the string inside the bundle, which yields a dashboard that loads
# its shell and then 404s every single page. Once rebuilt, serve it with
# `location /sauron/ { alias /usr/share/sauron/dashboard/; try_files $uri
# $uri/ /sauron/index.html; }` and drop any HTML rewriting.
server {
    listen 80;
    server_name _;
    root /usr/share/sauron/dashboard;
    index index.html;

    # Runtime config must never be cached — ops changes the API URL without a rebuild.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Fingerprinted build assets — cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
