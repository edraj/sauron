<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breadcrumb navigation direction — render harness</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const t = new URLSearchParams(location.search).get('theme');
      if (t === 'light' || t === 'dark') localStorage.setItem('sauron.theme', t);
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
