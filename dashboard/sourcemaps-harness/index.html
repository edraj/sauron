<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Source maps — render harness</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="/config.js"></script>
    <script>
      window.__err = null;
      window.addEventListener('error', function (e) {
        if (!window.__err) window.__err = String((e.error && e.error.stack) || e.message);
      });
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
