<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Person activity timeline — render harness</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Must load BEFORE the app module. `config/env.ts` reads
      `window.__SAURON_CONFIG__` at module scope and falls back to
      `http://localhost:8090` when it is absent — a port with nothing on it.
      The dev config's middleware answers this path.
    -->
    <script src="/config.js"></script>
    <!--
      Also before the app module, and for the same class of reason: `themeStore`
      is constructed at module scope (`export const themeStore = new ThemeStore()`)
      and reads localStorage in its constructor. Import evaluation is hoisted
      above `main.ts`'s body, so seeding the key there ran too late and
      `?theme=light` silently kept rendering dark.
    -->
    <script>
      const t = new URLSearchParams(location.search).get('theme');
      if (t === 'light' || t === 'dark') localStorage.setItem('sauron.theme', t);
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
