<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locked nav & locked actions — render harness</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Its own origin, not a fixed port: the stubs live in this dev server,
      // which the preview launcher may move off 3041 when that is taken.
      window.__SAURON_CONFIG__ = { apiBaseUrl: location.origin, ingestBaseUrl: location.origin };
    </script>
    <script>
      // `?lang=ar` seeds the locale BEFORE the store's constructor runs.
      const l = new URLSearchParams(location.search).get('lang');
      if (l === 'ar' || l === 'en') localStorage.setItem('sauron.locale', l);
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
