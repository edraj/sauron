# Sauron — full stack: Postgres + Redis + migrate (one-shot) + ingest + api + dashboard.
#
#   cp .env.example .env      # then edit JWT_SECRET
#   docker compose up --build
#
# Dashboard → http://localhost:3000   API → http://localhost:8080   Ingest → http://localhost:8081

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sauron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sauron}
      POSTGRES_DB: ${POSTGRES_DB:-sauron}
    # Peak pooled demand is api 16 + ingest 8 + alerts 8 + tier 4 + monitor
    # (50 + 8) + inspector 4 = 98, against a stock max_connections of 100 with
    # 3 reserved for superusers. Exhaustion surfaces as API 500s and ingest
    # 202-then-drop, not as an inspector error, so give it real headroom.
    #
    # Memory settings sized for the 62 GB host; the image defaults
    # (shared_buffers=128MB, work_mem=4MB) force every multi-million-row
    # aggregate through disk. shm_size lifts Docker's 64 MB /dev/shm, which
    # parallel query and parallel vacuum allocate DSM segments from — at the
    # default they die with "could not resize shared memory segment ... No
    # space left on device" long before the disk is actually full.
    shm_size: 2gb
    command: >-
      postgres
      -c max_connections=200
      -c shared_buffers=8GB
      -c effective_cache_size=24GB
      -c work_mem=32MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-sauron}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies migrations then exits. Others wait for it to complete.
  migrate:
    build:
      context: ./backend
      args:
        BIN: sauron-migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD:-sauron}@postgres:5432/${POSTGRES_DB:-sauron}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingest:
    build:
      context: ./backend
      args:
        BIN: sauron-ingest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD:-sauron}@postgres:5432/${POSTGRES_DB:-sauron}
      REDIS_URL: redis://redis:6379
      INGEST_PORT: "8081"
      # These are deliberately blank rather than `:-8` / `:-6000`. This service
      # has no `env_file:`, so an explicit entry is the only way a variable in
      # .env reaches the container — deleting the line would remove operator
      # override entirely. Passing a literal instead keeps compose winning after
      # any retune of the binary's default, which is exactly how the pinned
      # WORKER_CONCURRENCY=4 outlived the 1.3.0 changelog entry announcing 8.
      # Blank arrives as an empty string, which Config's `var()` filters, so the
      # number lives in sauron-core/src/config.rs alone. Same reasoning as
      # INSPECTOR_WINDOW_DAYS below.
      #
      # Raising WORKER_CONCURRENCY above 8 also needs INGEST_DB_POOL raised to
      # match, or the extra workers queue on connection checkout. See README's
      # Ingest gateway table for the measured worker/batch-size interaction.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      INGEST_RATE_LIMIT_PER_MIN: ${INGEST_RATE_LIMIT_PER_MIN:-}
      # Documented in .env.example but previously absent here, so editing them
      # in .env did nothing at all in the compose path.
      INGEST_MAX_BODY_BYTES: ${INGEST_MAX_BODY_BYTES:-}
      INGEST_BACKLOG: ${INGEST_BACKLOG:-}
      INGEST_DB_POOL: ${INGEST_DB_POOL:-}
      # Ingest accounting counters. Same blank-passthrough rule as above, so the
      # default (127.0.0.1:<INGEST_PORT + 10000>) lives in the binary.
      #
      # That default is LOOPBACK, and loopback inside a container is the
      # container — so `docker compose exec ingest curl -s localhost:18081/metrics`
      # reads it, while nothing on the host can. To scrape it from outside, set
      # INGEST_METRICS_ADDR=0.0.0.0:18081 in .env and publish 18081 below;
      # understand first that the counters are per-deployment event volumes.
      INGEST_METRICS_ADDR: ${INGEST_METRICS_ADDR:-}
      INGEST_METRICS_SAMPLE_SECS: ${INGEST_METRICS_SAMPLE_SECS:-}
      # Off by default: the published port is reached directly, so the header
      # would be caller-controlled. While off, client IPs are stored as NULL.
      # Set to true only behind a proxy you control.
      INGEST_TRUST_FORWARDED_HEADERS: ${INGEST_TRUST_FORWARDED_HEADERS:-false}
      RUST_LOG: ${RUST_LOG:-info,sauron=debug}
    ports:
      - "10001:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  monitor:
    build:
      context: ./backend
      args:
        BIN: sauron-monitor
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD:-sauron}@postgres:5432/${POSTGRES_DB:-sauron}
      MONITOR_TICK_MS: ${MONITOR_TICK_MS:-1000}
      MONITOR_BATCH: ${MONITOR_BATCH:-100}
      MONITOR_MAX_CONCURRENCY: ${MONITOR_MAX_CONCURRENCY:-50}
      MONITOR_CHECK_RETENTION_DAYS: ${MONITOR_CHECK_RETENTION_DAYS:-30}
      MONITOR_SSRF_ALLOW_PRIVATE: ${MONITOR_SSRF_ALLOW_PRIVATE:-false}
      # Monitor fires up/down alerts inline, so it needs the channel key. It is
      # required and has no fallback: every service that touches channels must
      # see the SAME value or it cannot decrypt what the others wrote.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      NOTIFY_SECRET_KEY: ${NOTIFY_SECRET_KEY:?set NOTIFY_SECRET_KEY in .env — see README, losing it is unrecoverable}
      RUST_LOG: ${RUST_LOG:-info,sauron=debug}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # Polling evaluator for metric-based alert rules (error spike/threshold, event
  # threshold, latency). Monitor up/down fires inline from `monitor` instead, so
  # without this service those metric rules are created in the UI but never
  # evaluate.
  alerts:
    build:
      context: ./backend
      args:
        BIN: sauron-alerts
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD:-sauron}@postgres:5432/${POSTGRES_DB:-sauron}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      NOTIFY_SECRET_KEY: ${NOTIFY_SECRET_KEY:?set NOTIFY_SECRET_KEY in .env — see README, losing it is unrecoverable}
      ALERTS_TICK_SECS: ${ALERTS_TICK_SECS:-30}
      NOTIFY_SUBS_TICK_SECS: ${NOTIFY_SUBS_TICK_SECS:-120}
      NOTIFY_SUBS_BATCH: ${NOTIFY_SUBS_BATCH:-200}
      NOTIFY_SUBS_MAX_PROBES_PER_ORG: ${NOTIFY_SUBS_MAX_PROBES_PER_ORG:-50}
      NOTIFY_DRAIN_BUDGET_MS: ${NOTIFY_DRAIN_BUDGET_MS:-10000}
      NOTIFY_MAX_EMAILS_PER_USER_PER_HOUR: ${NOTIFY_MAX_EMAILS_PER_USER_PER_HOUR:-20}
      NOTIFY_QUEUE_RETENTION_DAYS: ${NOTIFY_QUEUE_RETENTION_DAYS:-14}
      ALERTS_DELIVER_TIMEOUT_MS: ${ALERTS_DELIVER_TIMEOUT_MS:-10000}
      ALERTS_ALLOW_PRIVATE: ${ALERTS_ALLOW_PRIVATE:-false}
      RUST_LOG: ${RUST_LOG:-info,sauron=debug}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    build:
      context: ./backend
      args:
        BIN: sauron-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD:-sauron}@postgres:5432/${POSTGRES_DB:-sauron}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The API creates and edits notification channels, so it needs the same
      # channel key `monitor` and `alerts` deliver with. It also runs the
      # one-shot conversion of any pre-encryption `config` rows at boot.
      NOTIFY_SECRET_KEY: ${NOTIFY_SECRET_KEY:?set NOTIFY_SECRET_KEY in .env — see README, losing it is unrecoverable}
      JWT_ACCESS_TTL_SECS: "900"
      JWT_REFRESH_TTL_SECS: "2592000"
      AUTH_REVOCATION_POLL_SECS: "5"
      API_PORT: "8080"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:10002}
      # Off by default (port published directly). Behind a reverse proxy set
      # this to true, or the per-IP auth limits apply deployment-wide.
      API_TRUST_FORWARDED_HEADERS: ${API_TRUST_FORWARDED_HEADERS:-false}
      # Browser-facing origin of the dashboard, used to build links inside emails.
      # DELIBERATELY NO FALLBACK. Mirroring CORS_ALLOWED_ORIGINS' `:-http://localhost:10002`
      # is the obvious move and is exactly the behaviour this design rejects: the
      # URL would render, the message would send, the row would reach 'sent' —
      # every server-side signal reporting success while the recipient's browser
      # hits their own machine. Unset must produce the loud error naming the variable.
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # Deployment-level SMTP relay. Unset disables password reset; it does not
      # break the API.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Sauron}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_ALLOW_PRIVATE: ${SMTP_ALLOW_PRIVATE:-false}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      SMTP_SINK: ${SMTP_SINK:-false}
      MAIL_DRAIN_TICK_SECS: ${MAIL_DRAIN_TICK_SECS:-60}
      MAIL_OUTBOX_RETENTION_DAYS: ${MAIL_OUTBOX_RETENTION_DAYS:-30}
      # Shared with `inspector` (and TIER_HOT_DAYS with `tier`). Compose has no
      # shared env file, so these are repeated per service reading the SAME
      # variable: the API states the enforcement delay to the operator in words
      # and the inspector derives the hot boundary it is allowed to rewrite, so
      # a divergence here is a UI that lies and a masker that rewrites rows the
      # tier worker has already exported to Parquet.
      TIER_HOT_DAYS: ${TIER_HOT_DAYS:-30}
      INSPECTOR_POLICY_CACHE_SECS: ${INSPECTOR_POLICY_CACHE_SECS:-30}
      INSPECTOR_TAIL_SWEEP_SECS: ${INSPECTOR_TAIL_SWEEP_SECS:-120}
      TIER_COLD_PATH: /cold
      RUST_LOG: ${RUST_LOG:-info,sauron=debug}
    ports:
      - "10000:8080"
    volumes:
      - colddata:/cold:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  tier:
    build:
      context: ./backend
      args:
        BIN: sauron-tier
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD:-sauron}@postgres:5432/${POSTGRES_DB:-sauron}
      TIER_HOT_DAYS: ${TIER_HOT_DAYS:-30}
      TIER_GRANULARITY: ${TIER_GRANULARITY:-day}
      TIER_COLD_PATH: /cold
      TIER_DROP_LAG_HOURS: ${TIER_DROP_LAG_HOURS:-24}
      TIER_TICK_SECS: ${TIER_TICK_SECS:-3600}
      TIER_PARTITION_AHEAD: ${TIER_PARTITION_AHEAD:-7}
      RUST_LOG: ${RUST_LOG:-info,sauron=debug}
    volumes:
      - colddata:/cold
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # PII inspector: scans the telemetry jsonb columns for developer-supplied
  # personal data, retro-masks it in hot Postgres, and reaps its own audit rows.
  # OFF unless INSPECTOR_ENABLED is set — it reads the same partitions the ingest
  # path writes. No Redis and no JWT_SECRET: it serves no HTTP and decrypts
  # nothing, so it holds no secret at all.
  inspector:
    build:
      context: ./backend
      args:
        BIN: sauron-inspector
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sauron}:${POSTGRES_PASSWORD:-sauron}@postgres:5432/${POSTGRES_DB:-sauron}
      INSPECTOR_ENABLED: ${INSPECTOR_ENABLED:-false}
      INSPECTOR_TICK_SECS: ${INSPECTOR_TICK_SECS:-30}
      INSPECTOR_BATCH_ROWS: ${INSPECTOR_BATCH_ROWS:-5000}
      INSPECTOR_BATCH_PAUSE_MS: ${INSPECTOR_BATCH_PAUSE_MS:-200}
      INSPECTOR_LEASE_SECS: ${INSPECTOR_LEASE_SECS:-120}
      INSPECTOR_MAX_ATTEMPTS: ${INSPECTOR_MAX_ATTEMPTS:-3}
      INSPECTOR_STATEMENT_TIMEOUT_MS: ${INSPECTOR_STATEMENT_TIMEOUT_MS:-30000}
      # Deliberately blank rather than `:-30`. Unset, the binary inherits
      # SEARCH_SCAN_CLAMP_DAYS, which itself inherits TIER_HOT_DAYS — a literal
      # 30 here would keep scanning 30 days on a deployment that lowered
      # TIER_HOT_DAYS, reporting coverage for days Postgres no longer holds.
      INSPECTOR_WINDOW_DAYS: ${INSPECTOR_WINDOW_DAYS:-}
      INSPECTOR_DETECTOR_WINDOW_DAYS: ${INSPECTOR_DETECTOR_WINDOW_DAYS:-7}
      INSPECTOR_MAX_PHASE2_ROWS_PER_UNIT: ${INSPECTOR_MAX_PHASE2_ROWS_PER_UNIT:-200000}
      INSPECTOR_DEFAULT_SWEEP_ROWS: ${INSPECTOR_DEFAULT_SWEEP_ROWS:-50000}
      INSPECTOR_CATCHUP_GRACE_HOURS: ${INSPECTOR_CATCHUP_GRACE_HOURS:-6}
      INSPECTOR_SCAN_KEEP: ${INSPECTOR_SCAN_KEEP:-20}
      INSPECTOR_FINDING_RETENTION_DAYS: ${INSPECTOR_FINDING_RETENTION_DAYS:-90}
      INSPECTOR_MASK_BATCH: ${INSPECTOR_MASK_BATCH:-2000}
      INSPECTOR_MASK_PAUSE_MS: ${INSPECTOR_MASK_PAUSE_MS:-200}
      INSPECTOR_CLAIM_STALE_SECS: ${INSPECTOR_CLAIM_STALE_SECS:-300}
      INSPECTOR_PREVIEW_GC_DAYS: ${INSPECTOR_PREVIEW_GC_DAYS:-7}
      INSPECTOR_AUDIT_RETENTION_DAYS: ${INSPECTOR_AUDIT_RETENTION_DAYS:-0}
      INSPECTOR_AUDIT_PII_DAYS: ${INSPECTOR_AUDIT_PII_DAYS:-730}
      # Shared with `api` (and TIER_HOT_DAYS with `tier`) — same variable on
      # every service so the three cannot drift. See the note on `api`.
      TIER_HOT_DAYS: ${TIER_HOT_DAYS:-30}
      INSPECTOR_POLICY_CACHE_SECS: ${INSPECTOR_POLICY_CACHE_SECS:-30}
      INSPECTOR_TAIL_SWEEP_SECS: ${INSPECTOR_TAIL_SWEEP_SECS:-120}
      RUST_LOG: ${RUST_LOG:-info,sauron=debug}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    environment:
      # The browser reaches the API/ingest via the host-published ports, not the
      # compose network. Injected into config.js at container start.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:10000}
      INGEST_BASE_URL: ${INGEST_BASE_URL:-http://localhost:10001}
    ports:
      - "10002:80"
    depends_on:
      - api

volumes:
  pgdata: {}
  redisdata: {}
  colddata: {}
