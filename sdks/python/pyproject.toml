[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sauron-sdk"
version = "1.4.0"
description = "Server-side Python SDK for the Sauron observability + analytics gateway"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Sauron" }]
keywords = ["observability", "analytics", "error-tracking", "sauron"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# No runtime dependencies — transport uses stdlib urllib + threading.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/edraj/sauron"
Repository = "https://github.com/edraj/sauron"
Documentation = "https://github.com/edraj/sauron/wiki/Python-SDK"
Issues = "https://github.com/edraj/sauron/issues"
Changelog = "https://github.com/edraj/sauron/blob/main/sdks/python/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["sauron*"]

[tool.setuptools.package-data]
sauron = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
