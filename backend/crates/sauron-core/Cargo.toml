[package]
name = "sauron-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The wire envelope is published in the ingest OpenAPI document, so its
# schema is derived from the same types the gateway parses.
utoipa.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
thiserror.workspace = true
anyhow.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Per-event CPU baseline for the ingest write path. `harness = false` because
# this is a plain `fn main()` — deliberately not criterion, which would add ~30
# crates to the lockfile just to take a measurement.
[[bench]]
name = "json_tax"
harness = false
