[package]
name = "sauron-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sauron-core.workspace = true
sauron-query.workspace = true
sauron-inspector = { workspace = true }
sauron-purge = { workspace = true }
diesel.workspace = true
diesel-async.workspace = true
deadpool.workspace = true
diesel_migrations.workspace = true
scoped-futures.workspace = true
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
percent-encoding.workspace = true
base64.workspace = true
sha2.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# `sauron-auth` depends on `sauron-db` normally; this is a dev-dependency
# cycle, which Cargo permits because dev-dependencies are only pulled in to
# build this crate's own tests/examples/benches, never as part of the graph
# any other crate sees when it depends on `sauron-db`. Needed here (rather
# than a `sauron-auth`-side integration-test harness) because `sauron-auth`
# has none: it has no `tests/` directory and no dev-dependency on
# `sauron-db`'s test-only pieces, while `sauron-db/tests/env_scoping.rs`
# already has the `TestDb`/`seed_two_envs` harness `authorize_env_read`'s
# DB-backed tests need.
sauron-auth.workspace = true
# Same dev-only cycle, for the same reason. `deliver_after` is computed in SQL
# because the workspace has no `chrono-tz` and nothing in Rust can turn
# `(now, tz)` into a subscription's local wall clock, so the SQL `CASE` and
# `sauron_alerts::subscription::in_quiet_hours` are two implementations of one
# predicate. Two implementations drift silently and the symptom of the drift is
# somebody's phone at 04:00, so `tests/notifications.rs` pins them to each other
# over a shared table — which needs `sauron-alerts` here. It must stay a DEV
# dependency: `sauron-alerts` depends on `sauron-db` normally, so a plain
# dependency is a real cycle Cargo rejects.
sauron-alerts.workspace = true
