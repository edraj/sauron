[package]
name = "sauron-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sauron-core.workspace = true
sauron-db.workspace = true
sauron-inspector = { workspace = true }
sauron-redis.workspace = true
sauron-symbols.workspace = true
# For the ingest accounting counters the worker increments. `sauron-telemetry`
# has no in-workspace dependencies, so this adds no cycle.
sauron-telemetry.workspace = true
woothee.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true

[dev-dependencies]
# Used only by the workflow-lifecycle pipeline test in `process.rs` (a raw
# `sql_query` readback of the `workflows` table plus the ephemeral-database
# admin calls) — `sauron-db` re-exports its own repo/model layer, but not
# diesel itself, so the test needs these directly.
diesel.workspace = true
diesel-async.workspace = true
