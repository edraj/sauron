[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "1.2.1"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.82"

[workspace.dependencies]
# --- internal crates ---
sauron-core = { path = "crates/sauron-core" }
sauron-db = { path = "crates/sauron-db" }
sauron-redis = { path = "crates/sauron-redis" }
sauron-auth = { path = "crates/sauron-auth" }
sauron-pipeline = { path = "crates/sauron-pipeline" }
sauron-telemetry = { path = "crates/sauron-telemetry" }
sauron-monitor-core = { path = "crates/sauron-monitor-core" }
sauron-tier = { path = "crates/sauron-tier" }
sauron-symbols = { path = "crates/sauron-symbols" }
sauron-alerts = { path = "crates/sauron-alerts" }
sauron-query = { path = "crates/sauron-query" }
sauron-mail = { path = "crates/sauron-mail" }
sauron-inspector = { path = "crates/sauron-inspector" }

# --- async runtime / http ---
# Scoped tokio features (was "full") — only what the workspace actually uses:
# spawn/spawn_blocking/#[main] (rt-multi-thread), macros (main/test/select/join),
# net (TcpListener/lookup_host), time, sync (watch/mpsc), signal (ctrl_c),
# io-util (AsyncRead/Write), process (crebain harness). No fs/io-std.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "signal",
    "io-util",
    "process",
] }
axum = "0.8"
axum-extra = { version = "0.12", features = ["typed-header", "query"] }
# Already resolved transitively (axum, axum-extra, reqwest all pull it in for
# their own query/form codecs) — taken as a direct dependency so
# `routes::scope` can parse the raw query string itself, rather than through
# whichever `Query` extractor a handler happens to import. See
# `bins/sauron-api/src/routes/scope.rs` module docs for why that distinction
# matters.
form_urlencoded = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = [
    "trace",
    "cors",
    "limit",
    "request-id",
    "timeout",
    "set-header",
    "decompression-full",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

# --- cli / benchmarking (crebain) ---
clap = { version = "4", features = ["derive"] }
flate2 = "1"

# --- database ---
# `postgres_backend` (not `postgres`) gives the Pg query builder + types WITHOUT
# the libpq-linked sync connection; all I/O goes through diesel-async instead.
# `64-column-tables`: `error_events` crossed 32 columns when workflow grouping
# (2026-07-29-000032_workflows) added `workflow_id`/`workflow_name`, taking it
# to 33 -- diesel's tuple-based trait impls (e.g. `AppearsInFromClause`) are
# only generated up to 32 columns without this feature.
diesel = { version = "2.3", features = ["postgres_backend", "chrono", "uuid", "serde_json", "64-column-tables"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = "2.3"
# Direct dep so the pool can configure acquire/create/recycle timeouts, which
# deadpool only honours when a runtime is also configured.
deadpool = { version = "0.13", features = ["rt_tokio_1"] }
scoped-futures = "0.1"

# --- redis ---
redis = { version = "1", features = ["tokio-comp", "connection-manager", "streams"] }

# --- auth / crypto ---
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
sha2 = "0.11"
hex = "0.4"
# AES-256-GCM for encrypting notification-channel secrets at rest.
aes-gcm = "0.10"

# --- notifications / email ---
# rustls-only (matches reqwest's rustls-tls); no OpenSSL. Async SMTP over Tokio.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
    "pool",
] }
# pkg-config: link the system libzstd instead of compiling the vendored C source
# (the slowest compile unit at ~38s). libzstd is present on every Fedora/RHEL host;
# needs libzstd-devel at build. Feature-unifies across the transitive zstd-sys pulled
# by tower-http's decompression-full too.
zstd = { version = "0.13", features = ["pkg-config"] }
object = "0.36"
addr2line = "0.24"
gimli = "0.31"

# --- serialization / validation / ids / time ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"

# --- enrichment ---
woothee = "0.13"

# --- observability / errors / config ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"

[profile.release]
# Strip symbol tables from release binaries → smaller binaries and RPMs.
# (debuginfo is already suppressed by `%global debug_package %{nil}` in the spec,
# and release builds carry no `-g` debug info, so nothing diagnostic is lost.)
# Deliberately NOT setting `lto` or `codegen-units = 1`: those shave a little more
# size but SLOW the compile substantially, which is the opposite of the goal here.
strip = true
