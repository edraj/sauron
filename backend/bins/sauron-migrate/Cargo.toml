[package]
name = "sauron-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sauron-migrate"
path = "src/main.rs"

[dependencies]
sauron-db.workspace = true
# Only `backfill-users-seen` uses it: it reads each issue's HyperLogLog
# (`PFCOUNT`) to repair `issues.users_seen`. Never touched by the no-argument
# migrate path.
sauron-redis.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The `backfill-users-seen` test builds `issues` rows (`NewIssue` carries
# `DateTime<Utc>` timestamps).
chrono.workspace = true
